<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Transportes Cóndor</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>

<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo-container">
        <span class="logo-icon">🦅</span>
        <div class="logo-text">
          <h1>Transportes Cóndor</h1>
          <span>Acceso Clientes</span>
        </div>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="rutas.html">Rutas</a></li>
          <li><a href="servicios.html">Servicios</a></li>
          <li><a href="mision-vision.html">Misión y Visión</a></li>
          <li><a href="registro.html">Registro</a></li>
          <li><a href="login.html" class="active">Iniciar Sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 1.5rem;">🔑 Acceso al Sistema</h2>

      <!-- Se añade method="POST" -->
      <form id="loginForm" method="POST">
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <!-- Se ajusta name="email" e id="email" para coincidir con procesar_login.php -->
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div style="margin-bottom: 1rem; text-align: right;">
          <a href="recuperacion.html" style="color: var(--primary-color); font-size: 0.9rem;">¿Olvidaste tu
            contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Iniciar Sesión</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Transportes Cóndor. Todos los derechos reservados.</p>
  </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Transportes Cóndor</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo-container">
        <span class="logo-icon">🦅</span>
        <div class="logo-text">
          <h1>Transportes Cóndor</h1>
          <span>Soporte</span>
        </div>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Volver al Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 1.5rem;">🔒 Recuperación de Cuenta</h2>
      <p style="margin-bottom: 1.2rem; text-align: center; color: #666;">Ingresa tu correo registrado para enviarte un enlace de restablecimiento.</p>
      
      <form id="recuperarForm">
        <div class="form-group">
          <label for="rec-email">Correo Electrónico:</label>
          <input type="email" id="rec-email" placeholder="ejemplo@correo.com" required>
        </div>

        <button type="submit" class="btn-primary">Enviar Enlace de Recuperación</button>
      </form>

      <div id="recAlert" class="alert alert-info">
        Se han enviado las instrucciones de recuperación a su correo electrónico.
      </div>
    </div>
  </main>

  <script>
    document.getElementById('recuperarForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('recAlert').style.display = 'block';
      this.reset();
    });
  </script>

  <footer>
    <p>&copy; 2026 Transportes Cóndor. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
